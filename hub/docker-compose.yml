services:
  shrimp-link:
    build:
      context: ..
      dockerfile: hub/Dockerfile
    container_name: shrimp-link
    restart: unless-stopped
    ports:
      - "3250:3250"
    environment:
      - AGENT_SECRETS=${AGENT_SECRETS}
    volumes:
      - shrimp-link-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3250/v1/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  shrimp-link-data:
